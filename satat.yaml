# Satat configuration. Only lanes exist so far; the rest of the spec is #108.
#
# A lane is the fixed shape a step runs in (ADR 0026). It comes from this file only: no issue
# text, workflow input or agent output can change one (ADR 0027). The Docker launcher refuses
# to start if a lane breaks the hardening floor (non-root, no capabilities, read-only root,
# limits set, image pinned by digest).
# Caps the workflow enforces through Hatchet (ADR 0023): the whole platform, each repo, each credential
# account, and each lane (max_runs under the lane). Over-cap work queues; it is not dropped.
# Sized for the laptop: the Docker VM has 5.77 GiB, the platform takes about 0.4 GiB, and a Claude step
# measured about 0.14 GiB on a small repo (docker-prototype.md), so 2 is far below the limit.
limits:
  global: 2
  per_repo: 1
  per_account: 1

# Persistent caches (a lane's caches.persist) of all lanes together: one unused for longer than
# max_unused is evicted, and over max_size the least recently used go first (ADR 0033).
cache_reaper:
  max_unused: 336h   # 14 days
  max_size: 20GiB

# The poller (#135): every cron tick the worker queues the open ready-for-agent issues of these
# repos that have no run and no open PR yet. Off while repos is empty. Each repo needs a token
# with Issues: read and Pull requests: read (SATAT_GITHUB_TOKEN), and only trusted repos belong
# here (ADR 0026). Example:
#   repos:
#     - name: owner/name
#       base: main     # default main
#       lane: claude   # default claude
poller:
  cron: "*/5 * * * *"
  repos: []

lanes:
  # Claude Code on the subscription token (slice 4). The image is built locally:
  #   scripts/build-claude-image.sh   (prints the digest-pinned reference to paste below)
  # Publishing it to GHCR comes later. Run it with: go run ./cmd/satat-step --repo ... --issue N
  claude:
    image: satat-claude@sha256:5d0a2935e81590e39b09bb3ad74298e05281080f9871c2f359a048389062f0c9
    # The image's entrypoint is the Satat runner; no command override.
    memory: 3GiB
    cpus: 2
    pids: 512
    # tmpfs at /workspace holds HOME and the clone, and counts against `memory`.
    workspace: 1GiB
    timeout: 20m
    # The step holds no GitHub credential: the worker clones the repo with the read token
    # (SATAT_GITHUB_TOKEN, held by the worker only) before the step starts, and the runner copies the
    # clone in. The token needs Contents: read (the clone) and Issues: read (the ready-for-agent
    # check); without Issues: read a private repo answers 404 and every run fails closed.
    pass_env: [CLAUDE_CODE_OAUTH_TOKEN]
    # Override the agent's git identity (default: Satat); skipped when unset.
    optional_env: [SATAT_GIT_NAME, SATAT_GIT_EMAIL]
    # The credential account this lane spends (the Claude subscription): one cap across lanes that
    # share it. max_runs is this lane's own cap.
    account: claude-subscription
    max_runs: 1
    # Needs to reach Anthropic and GitHub; open egress until the proxy exists (see smoke).
    internal: false
    # Build caches on disk volumes, outside /workspace, so they do not count against `memory`
    # (ADR 0033). The paths match the image's cache env vars; /cache/tmp takes temp files a
    # build needs to execute, which the noexec /tmp tmpfs refuses. Persistent per (lane, repo):
    # mise installs the repo's toolchains into /cache/mise once, then every later step of that repo
    # reuses them (a cold install is about 30 s, a warm one about 1 s). persist: false would remove
    # them with the step.
    caches:
      persist: true
      paths:
        mise: /cache/mise
        mise-cache: /cache/mise-cache
        mise-state: /cache/mise-state
        go-mod: /cache/go-mod
        go-build: /cache/go-build
        pip: /cache/pip
        npm: /cache/npm
        maven: /cache/maven
        gradle: /cache/gradle
        corepack: /cache/corepack
        tmp: /cache/tmp

  # Placeholder until the Claude Code image exists (slice 4 replaces it).
  smoke:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    # user: 10001:10001   # default; must be numeric and non-root
    command: ["sh", "-c", "id && echo ok"]
    memory: 512MiB
    cpus: 1
    pids: 256
    # tmpfs at /workspace. Memory-backed, so it counts against `memory`.
    workspace: 128MiB
    timeout: 5m
    # Names copied from the worker's environment into the step. A name that is unset fails
    # the launch. Never put a value here.
    pass_env: []
    # internal: false puts the lane's network on a plain bridge, so the step has open egress.
    # That is acceptable only because the prototype points at the owner's repos. Set it to true
    # when the egress proxy exists and the lane's network should have no route out except to
    # containers attached to it.
    internal: false

  # Runs a command over a set of files with no network. Used by the eval harness to run held-out
  # tests; the step input is {"files": {path: base64}, "command": [...]}.
  check-python:
    image: python:3.13.16-slim@sha256:cf50a4f6ac4f026458b08d5222023d700ac806410dff5e9ca8728fa44f2b850f
    command:
      - python
      - -I
      - -c
      - |
        import base64, json, os, subprocess, sys
        spec = json.load(open(os.environ["SATAT_INPUT"]))
        root = "/workspace/repo"
        for name, data in spec["files"].items():
            if name.startswith("/") or ".." in name.split("/"):
                sys.exit("refusing path " + name)
            path = os.path.join(root, name)
            os.makedirs(os.path.dirname(path), exist_ok=True)
            with open(path, "wb") as f:
                f.write(base64.b64decode(data))
        sys.exit(subprocess.run(spec["command"], cwd=root, stderr=subprocess.STDOUT).returncode)
    memory: 512MiB
    cpus: 1
    pids: 128
    workspace: 128MiB
    timeout: 5m
    internal: true
