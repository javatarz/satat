name: satat

networks:
  satat:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  canvas_data:

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /opt/satat/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - satat

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    environment:
      LLMGATEWAY_API_KEY: ${LLMGATEWAY_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - /opt/satat/gateway/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - satat

  canvas:
    image: ghcr.io/openhands/agent-canvas:1.25.0
    restart: unless-stopped
    environment:
      LOCAL_BACKEND_API_KEY: ${CANVAS_API_KEY}
      OH_SECRET_KEY: ${OH_SECRET_KEY}
      AGENT_CANVAS_DISABLE_TELEMETRY: "1"
      AUTOMATION_GIT_SYNC_REPO_URL: ${AUTOMATION_GIT_SYNC_REPO_URL}
      AUTOMATION_GIT_SYNC_BRANCH: ${AUTOMATION_GIT_SYNC_BRANCH}
      AUTOMATION_GIT_SYNC_PATH: ${AUTOMATION_GIT_SYNC_PATH}
      AUTOMATION_GIT_SYNC_TOKEN: ${GIT_SYNC_TOKEN}
      AUTOMATION_GIT_SYNC_AUTHOR_NAME: Satat
      AUTOMATION_GIT_SYNC_AUTHOR_EMAIL: satat@karun.me
    volumes:
      - canvas_data:/home/openhands/.openhands
    networks:
      - satat

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - satat
