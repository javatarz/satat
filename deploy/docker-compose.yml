name: satat

networks:
  satat:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  canvas_data:
  ntfy_cache:
  alloy_data:

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # Injected as X-Session-API-Key for /api/automation/* (see Caddyfile.tmpl).
      AUTOMATION_LOCAL_API_KEY: ${CANVAS_API_KEY}
    volumes:
      - /opt/satat/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - satat

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    environment:
      LLMGATEWAY_API_KEY: ${LLMGATEWAY_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${DATABASE_URL}
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://alloy:4318
      LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
      WEBHOOK_URL: http://budget-relay:8080/
    volumes:
      - /opt/satat/gateway/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - satat

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_GITHUB_USERS: ${OAUTH2_ALLOWLIST}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REDIRECT_URL: "https://${SATAT_DOMAIN}/oauth2/callback"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "${SATAT_DOMAIN}"
    networks:
      - satat

  canvas:
    image: ghcr.io/openhands/agent-canvas:1.26.0
    restart: unless-stopped
    environment:
      LOCAL_BACKEND_API_KEY: ${CANVAS_API_KEY}
      OH_SECRET_KEY: ${OH_SECRET_KEY}
      AGENT_CANVAS_DISABLE_TELEMETRY: "1"
      AUTOMATION_GIT_SYNC_REPO_URL: ${AUTOMATION_GIT_SYNC_REPO_URL}
      AUTOMATION_GIT_SYNC_BRANCH: ${AUTOMATION_GIT_SYNC_BRANCH}
      AUTOMATION_GIT_SYNC_PATH: ${AUTOMATION_GIT_SYNC_PATH}
      AUTOMATION_GIT_SYNC_TOKEN: ${GIT_SYNC_TOKEN}
      AUTOMATION_GIT_SYNC_AUTHOR_NAME: Satat
      AUTOMATION_GIT_SYNC_AUTHOR_EMAIL: satat@karun.me
      AUTOMATION_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - canvas_data:/home/openhands/.openhands
    networks:
      - satat

  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    restart: unless-stopped
    command: serve
    init: true
    volumes:
      - /opt/satat/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v1/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - satat

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_OTLP_USERNAME: ${GRAFANA_CLOUD_OTLP_USERNAME}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USERNAME: ${GRAFANA_CLOUD_PROM_USERNAME}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - /opt/satat/gateway/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    pid: host
    cap_add:
      - SYS_TIME
    networks:
      - satat

  budget-relay:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python3", "/app/budget-relay.py"]
    environment:
      NTFY_PUBLISH_URL: https://notify.${SATAT_DOMAIN}/${NTFY_TOPIC}
      SATAT_DOMAIN: ${SATAT_DOMAIN}
    volumes:
      - /opt/satat/budget-relay.py:/app/budget-relay.py:ro
    networks:
      - satat

  healthcheck-pinger:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL}
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
        curl -fsS --max-time 10 "$$HEALTHCHECKS_PING_URL" >/dev/null 2>&1 || true;
        sleep 60;
        done
    networks:
      - satat

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - satat
