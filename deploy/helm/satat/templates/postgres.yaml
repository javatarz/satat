apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "satat.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
spec:
  selector:
    {{- include "satat.selector" (dict "name" "postgres" "root" .) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "satat.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "satat.selector" (dict "name" "postgres" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "satat.labels" (dict "name" "postgres" "root" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image's postgres user. Its entrypoint initialises the data directory as that user.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: hatchet
            - name: POSTGRES_DB
              value: hatchet
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: satat-postgres
                  key: POSTGRES_PASSWORD
            # A subdirectory, so initdb finds it empty even if the volume has lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hatchet", "-d", "hatchet"]
            periodSeconds: 5
            timeoutSeconds: 3
          # The upstream image writes its socket and runtime files under its own root
          # (/var/run/postgresql), so its root filesystem stays writable. Everything else is dropped.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # The claim outlives the release: helm uninstall keeps it, deploy down --volumes deletes it.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
