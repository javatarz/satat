# hatchet-lite: the Hatchet engine, API and dashboard in one container (as on Compose).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hatchet-config
  labels:
    {{- include "satat.labels" (dict "name" "hatchet-lite" "root" .) | nindent 4 }}
  annotations:
    # Its generated keys go with the tenant in Postgres: uninstall keeps both, deploy down
    # --volumes deletes both.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hatchet-lite
  labels:
    {{- include "satat.labels" (dict "name" "hatchet-lite" "root" .) | nindent 4 }}
spec:
  # NodePort so the satat CLI on the host reaches it through k3d's 127.0.0.1 port maps. The worker
  # uses the cluster address hatchet-lite:7077 and :8888.
  type: NodePort
  selector:
    {{- include "satat.selector" (dict "name" "hatchet-lite" "root" .) | nindent 4 }}
  ports:
    - name: grpc
      port: 7077
      targetPort: grpc
      nodePort: {{ .Values.hatchet.nodePorts.grpc }}
    - name: rest
      port: 8888
      targetPort: rest
      nodePort: {{ .Values.hatchet.nodePorts.rest }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hatchet-lite
  labels:
    {{- include "satat.labels" (dict "name" "hatchet-lite" "root" .) | nindent 4 }}
spec:
  replicas: 1
  # One pod at a time on the ReadWriteOnce config volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "satat.selector" (dict "name" "hatchet-lite" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "satat.labels" (dict "name" "hatchet-lite" "root" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image sets no user. Its entrypoint writes only /config (generated keys), which the
        # volume makes writable through fsGroup, so it runs as an unprivileged uid.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hatchet-lite
          image: {{ .Values.hatchet.image }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: satat-postgres
                  key: POSTGRES_PASSWORD
            # Built in the container from the Secret; the password is base64url, so URL-safe.
            - name: DATABASE_URL
              value: postgresql://hatchet:$(POSTGRES_PASSWORD)@postgres:5432/hatchet?sslmode=disable
            - name: SERVER_MSGQUEUE_KIND
              value: postgres
            # The addresses the CLI on the host uses, through the NodePorts; the token carries them.
            - name: SERVER_URL
              value: http://localhost:8888
            - name: SERVER_AUTH_COOKIE_DOMAIN
              value: localhost
            - name: SERVER_AUTH_COOKIE_INSECURE
              value: "t"
            - name: SERVER_AUTH_SET_EMAIL_VERIFIED
              value: "t"
            - name: SERVER_GRPC_BIND_ADDRESS
              value: 0.0.0.0
            - name: SERVER_GRPC_PORT
              value: "7077"
            - name: SERVER_GRPC_INSECURE
              value: "t"
            - name: SERVER_GRPC_BROADCAST_ADDRESS
              value: localhost:7077
            - name: SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS
              value: localhost:7077
            # Run history survives a month; the default would delete finished runs sooner (ADR 0023).
            - name: SERVER_LIMITS_DEFAULT_TENANT_RETENTION_PERIOD
              value: 720h
          ports:
            - name: grpc
              containerPort: 7077
            - name: rest
              containerPort: 8888
            - name: health
              containerPort: 8733
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          # The upstream image runs its entrypoint from / and is not built for a read-only root,
          # so its root filesystem stays writable. Everything else is dropped.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: hatchet-config
