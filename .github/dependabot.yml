# Weekly update PRs, one grouped PR per ecosystem to keep the noise down. Images are pinned as
# name:tag@sha256 (#66); Dependabot bumps the tag and the digest together.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/images/claude", "/images/worker"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  # Postgres majors cannot reuse the data volume, and the Hatchet server and Go SDK move together
  # after a live re-check (#180, #189 were checked on v0.110.5): bump those by hand.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: hatchet-dev/hatchet/hatchet-lite
    groups:
      docker-compose:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/hatchet-dev/hatchet
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
