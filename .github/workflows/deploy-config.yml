name: Deploy config

on:
  workflow_call:
    inputs:
      scope:
        description: "all = deploy/ + gateway/, litellm = gateway/ config only"
        required: false
        type: string
        default: all

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools gettext-base rsync

      - name: Discover VM address and WireGuard server key
        run: |
          {
            echo "VM_IP=$(aws ec2 describe-addresses \
              --filters 'Name=tag:Name,Values=satat' \
              --query 'Addresses[0].PublicIp' --output text)"
            echo "SERVER_PUBKEY=$(aws ssm get-parameter \
              --name /satat/wireguard/server_public_key \
              --query 'Parameter.Value' --output text)"
          } >> "$GITHUB_ENV"

      - name: Fetch model pricing
        env:
          SATAT_MODEL_CHEAP: ${{ vars.SATAT_MODEL_CHEAP }}
          SATAT_MODEL_STANDARD: ${{ vars.SATAT_MODEL_STANDARD }}
          SATAT_MODEL_EXPENSIVE: ${{ vars.SATAT_MODEL_EXPENSIVE }}
        run: |
          set -euo pipefail
          curl -fsSL https://api.llmgateway.io/v1/models -o "$RUNNER_TEMP/models.json"
          lookup() {
            jq -er --arg m "$1" --arg k "$2" \
              '.data[] | select(.id==$m) | .pricing[$k] | select(. != "" and . != null and . != "0")' \
              "$RUNNER_TEMP/models.json"
          }
          : > "$RUNNER_TEMP/prices.env"
          for tier in CHEAP STANDARD EXPENSIVE; do
            id_var="SATAT_MODEL_$tier"
            id="${!id_var:?}"
            in=$(lookup "$id" prompt)
            out=$(lookup "$id" completion)
            {
              printf 'SATAT_MODEL_%s_IN=%s\n' "$tier" "$in"
              printf 'SATAT_MODEL_%s_OUT=%s\n' "$tier" "$out"
            } >> "$RUNNER_TEMP/prices.env"
          done
          cat "$RUNNER_TEMP/prices.env" >> "$GITHUB_ENV"

      - name: Render configs
        env:
          SATAT_DOMAIN: ${{ vars.SATAT_DOMAIN }}
          SATAT_EMAIL: ${{ vars.SATAT_EMAIL }}
          SATAT_MODEL_CHEAP: ${{ vars.SATAT_MODEL_CHEAP }}
          SATAT_MODEL_STANDARD: ${{ vars.SATAT_MODEL_STANDARD }}
          SATAT_MODEL_EXPENSIVE: ${{ vars.SATAT_MODEL_EXPENSIVE }}
          SATAT_MONTHLY_BUDGET: ${{ vars.SATAT_MONTHLY_BUDGET }}
          CADDY_SUBST: "$SATAT_DOMAIN $SATAT_EMAIL"
          LITELLM_SUBST: >-
            $SATAT_MODEL_CHEAP $SATAT_MODEL_STANDARD $SATAT_MODEL_EXPENSIVE
            $SATAT_MONTHLY_BUDGET $SATAT_MODEL_CHEAP_IN $SATAT_MODEL_CHEAP_OUT
            $SATAT_MODEL_STANDARD_IN $SATAT_MODEL_STANDARD_OUT
            $SATAT_MODEL_EXPENSIVE_IN $SATAT_MODEL_EXPENSIVE_OUT
        run: |
          set -euo pipefail
          : "${SATAT_DOMAIN:?}" "${SATAT_EMAIL:?}"
          : "${SATAT_MODEL_CHEAP:?}" "${SATAT_MODEL_STANDARD:?}"
          : "${SATAT_MODEL_EXPENSIVE:?}" "${SATAT_MONTHLY_BUDGET:?}"
          envsubst "$CADDY_SUBST" < gateway/Caddyfile.tmpl > gateway/Caddyfile
          envsubst "$LITELLM_SUBST" \
            < gateway/litellm-config.yaml.tmpl > gateway/litellm-config.yaml

      - name: Connect to WireGuard
        env:
          CI_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
        run: |
          sudo install -d -m 0700 /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf >/dev/null <<EOF
          [Interface]
          PrivateKey = ${CI_WG_PRIVATE_KEY}
          Address = 10.10.0.3/32
          [Peer]
          PublicKey = ${SERVER_PUBKEY}
          Endpoint = ${VM_IP}:51820
          AllowedIPs = 10.10.0.1/32
          PersistentKeepalive = 25
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Deploy configuration
        env:
          SCOPE: ${{ inputs.scope }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          LLMGATEWAY_API_KEY: ${{ secrets.LLMGATEWAY_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          SSH="ssh -i $RUNNER_TEMP/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          remote_md5() { $SSH deploy@10.10.0.1 "md5sum /opt/satat/gateway/$1 2>/dev/null" | cut -d' ' -f1; }
          OLD_CADDY=$(remote_md5 Caddyfile || true)
          OLD_LITELLM=$(remote_md5 litellm-config.yaml || true)
          NEW_CADDY=$(md5sum gateway/Caddyfile | cut -d' ' -f1)
          NEW_LITELLM=$(md5sum gateway/litellm-config.yaml | cut -d' ' -f1)
          if [ "$SCOPE" = "all" ]; then
            rsync -az --exclude='.env' --exclude='.env.*' -e "$SSH" deploy/ deploy@10.10.0.1:/opt/satat/
          fi
          rsync -az -e "$SSH" gateway/ deploy@10.10.0.1:/opt/satat/gateway/
          if [ "$SCOPE" = "all" ]; then
            {
              printf 'LLMGATEWAY_API_KEY=%s\n' "$LLMGATEWAY_API_KEY"
              printf 'LITELLM_MASTER_KEY=%s\n' "$LITELLM_MASTER_KEY"
              printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
              printf 'DATABASE_URL=postgresql://litellm:%s@postgres:5432/litellm\n' "$POSTGRES_PASSWORD"
            } | $SSH deploy@10.10.0.1 'umask 077 && cat > /opt/satat/.env'
          fi
          $SSH deploy@10.10.0.1 'cd /opt/satat && docker compose up -d'
          if [ "$OLD_CADDY" != "$NEW_CADDY" ]; then
            $SSH deploy@10.10.0.1 'cd /opt/satat && docker compose restart caddy'
          fi
          if [ "$OLD_LITELLM" != "$NEW_LITELLM" ]; then
            $SSH deploy@10.10.0.1 'cd /opt/satat && docker compose restart litellm'
          fi
