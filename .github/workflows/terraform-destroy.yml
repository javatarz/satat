name: Terraform destroy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_deploy_wg_public_key: ${{ vars.TF_VAR_deploy_wg_public_key }}
  TF_VAR_laptop_wg_public_key: ${{ vars.TF_VAR_laptop_wg_public_key }}
  TF_VAR_deploy_ssh_public_key: ${{ vars.TF_VAR_deploy_ssh_public_key }}
  TF_VAR_owner_ssh_public_key: ${{ vars.TF_VAR_owner_ssh_public_key }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan destroy
        run: |
          set -o pipefail
          terraform plan -destroy -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-destroy
          path: terraform/tfplan

  destroy:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-destroy
          path: terraform

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Destroy
        run: terraform apply -input=false -no-color tfplan
