name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_deploy_wg_public_key: ${{ vars.TF_VAR_deploy_wg_public_key }}
  TF_VAR_laptop_wg_public_key: ${{ vars.TF_VAR_laptop_wg_public_key }}
  TF_VAR_deploy_ssh_public_key: ${{ vars.TF_VAR_deploy_ssh_public_key }}
  TF_VAR_owner_ssh_public_key: ${{ vars.TF_VAR_owner_ssh_public_key }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file plan.txt

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: terraform

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Apply
        run: terraform apply -input=false -no-color tfplan
