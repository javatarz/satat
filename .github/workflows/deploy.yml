name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "gateway/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-config.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-config.yml
    with:
      scope: all
    secrets: inherit
