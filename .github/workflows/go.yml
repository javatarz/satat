name: Go

on:
  pull_request:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "compose.yaml", "scripts/check-compose-socket.sh", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      # Includes the launcher conformance suite, which starts real containers on the runner's Docker.
      # -p 1: the Docker-backed tests of several packages share one daemon and reap by label, so
      # they must not run at the same time.
      - run: go test -p 1 ./... -count=1 -timeout 15m

      - name: Only docker-proxy mounts the Docker socket
        run: scripts/check-compose-socket.sh
