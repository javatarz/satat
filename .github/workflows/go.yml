name: Go

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "compose.yaml"
      - "satat.yaml"
      - "deploy/**"
      - "scripts/check-compose-socket.sh"
      - "images/worker/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go run ./cmd/satat deploy render --check

      # Includes the launcher conformance suite, which starts real containers on the runner's Docker.
      # -p 1: the Docker-backed tests of several packages share one daemon and reap by label, so
      # they must not run at the same time.
      - run: go test -p 1 ./... -count=1 -timeout 15m

      - name: Only docker-proxy mounts the Docker socket
        run: scripts/check-compose-socket.sh

      # Catches a package the worker imports but the image build does not copy.
      - name: Build the worker image
        env:
          HATCHET_CLIENT_TOKEN: unused
          CLAUDE_CODE_OAUTH_TOKEN: unused
          SATAT_GITHUB_TOKEN: unused
          SATAT_PUSH_TOKEN: unused
          POSTGRES_PASSWORD: unused
        run: docker compose build worker
