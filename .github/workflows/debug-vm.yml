name: Debug VM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools rsync

      - name: Discover VM address and WireGuard server key
        run: |
          {
            echo "VM_IP=$(aws ec2 describe-addresses \
              --filters 'Name=tag:Name,Values=satat' \
              --query 'Addresses[0].PublicIp' --output text)"
            echo "SERVER_PUBKEY=$(aws ssm get-parameter \
              --name /satat/wireguard/server_public_key \
              --query 'Parameter.Value' --output text)"
          } >> "$GITHUB_ENV"

      - name: Connect to WireGuard
        env:
          CI_WG_PRIVATE_KEY: ${{ secrets.DEPLOY_WG_PRIVATE_KEY }}
        run: |
          sudo install -d -m 0700 /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf >/dev/null <<EOF
          [Interface]
          PrivateKey = ${CI_WG_PRIVATE_KEY}
          Address = 10.10.0.3/32
          [Peer]
          PublicKey = ${SERVER_PUBKEY}
          Endpoint = ${VM_IP}:51820
          AllowedIPs = 10.10.0.1/32
          PersistentKeepalive = 25
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Inspect stack
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/k"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/k"
          SSH="ssh -i $RUNNER_TEMP/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          $SSH deploy@10.10.0.1 'bash -s' <<'REMOTE'
          set -uo pipefail
          cd /opt/satat
          echo "--- compose ps ---"
          docker compose ps -a
          KEY=$(grep '^LITELLM_MASTER_KEY=' .env | cut -d= -f2-)
          echo "--- /v1/models ids ---"
          curl -sSk --resolve satat.karun.me:443:127.0.0.1 \
            -H "Authorization: Bearer $KEY" \
            https://satat.karun.me/v1/models | jq -c '[.data[].id]'
          echo "--- /model/info costs ---"
          curl -sSk --resolve satat.karun.me:443:127.0.0.1 \
            -H "Authorization: Bearer $KEY" \
            https://satat.karun.me/model/info \
            | jq -c '[.data[] | {model_name, in: .model_info.input_cost_per_token, out: .model_info.output_cost_per_token}]'
          echo "--- /global/spend ---"
          curl -sSk --resolve satat.karun.me:443:127.0.0.1 \
            -H "Authorization: Bearer $KEY" \
            https://satat.karun.me/global/spend | jq -c . || true
          REMOTE